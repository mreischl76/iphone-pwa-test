[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="docs/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
; Single-threaded build. Threaded web builds need cross-origin isolation
; headers (COOP/COEP) that GitHub Pages cannot send, and Safari has been
; the least reliable browser for them. This is the iPhone-friendly variant.
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
; PWA: Godot generates the manifest + service worker that make the game
; installable to the Home Screen and playable offline.
progressive_web_app/enabled=true
; Only needed for threaded builds; off because this one is single-threaded.
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
; 1 = standalone (no Safari address bar), 2 = portrait
progressive_web_app/display=1
progressive_web_app/orientation=2
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0.113725, 0.207843, 0.341176, 1)
